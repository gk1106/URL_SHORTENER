name: gk-go-server
services:
  web:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [frontend, keycloak]
  auth-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
    volumes: ["auth-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://auth-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}/auth
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./.local/server:/opt/keycloak/data/import:ro
      - ./infra/keycloak/themes/gk-go:/opt/keycloak/themes/gk-go:ro
    depends_on:
      auth-db: {condition: service_healthy}
  oracle:
    image: gvenzl/oracle-free:23-slim
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD}
      APP_USER: shortener
      APP_USER_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: ["oracle-data:/opt/oracle/oradata"]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend/Shortner
    restart: unless-stopped
    environment:
      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      DB_USERNAME: shortener
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      OIDC_ISSUER_URI: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}/auth/realms/shortener
      OIDC_JWK_SET_URI: http://keycloak:8080/auth/realms/shortener/protocol/openid-connect/certs
      OIDC_AUDIENCE: shortener-api
      APP_BASE_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
    depends_on:
      oracle: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: /api/v1
      OIDC_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}/auth
      OIDC_REALM: shortener
      OIDC_CLIENT_ID: gk-go-web
      REGISTRATION_ENABLED: "true"
    depends_on: [backend]
volumes:
  caddy-data:
  caddy-config:
  auth-data:
  oracle-data:
  redis-data:
