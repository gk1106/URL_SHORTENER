name: gk-go-server
# Runtime limits apply to this project only, not the VPS's existing projects.
x-bounded-logs: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  web:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    mem_limit: 48m
    memswap_limit: 96m
    cpus: 0.10
    pids_limit: 64
    logging: *bounded-logs
    # The VPS's existing reverse proxy owns public ports 80/443 and HTTPS.
    ports: ["127.0.0.1:${WEB_PORT:-18090}:80"]
    volumes:
      - ./infra/Caddyfile.shared:/etc/caddy/Caddyfile:ro
    depends_on: [frontend, keycloak]
  auth-db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 256m
    cpus: 0.25
    pids_limit: 64
    logging: *bounded-logs
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "work_mem=1MB", "-c", "maintenance_work_mem=16MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
    volumes: ["auth-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start", "--import-realm"]
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 1280m
    cpus: 0.50
    pids_limit: 192
    logging: *bounded-logs
    environment:
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx384m"
      JAVA_OPTS_APPEND: "-XX:ActiveProcessorCount=1 -XX:MaxDirectMemorySize=32m"
      KC_DB_POOL_INITIAL_SIZE: "1"
      KC_DB_POOL_MIN_SIZE: "1"
      KC_DB_POOL_MAX_SIZE: "5"
      KC_HTTP_POOL_MAX_THREADS: "16"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://auth-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}/auth
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./.local/server:/opt/keycloak/data/import:ro
      - ./infra/keycloak/themes/gk-go:/opt/keycloak/themes/gk-go:ro
    depends_on:
      auth-db: {condition: service_healthy}
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 192m
    memswap_limit: 384m
    cpus: 0.25
    pids_limit: 64
    logging: *bounded-logs
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "work_mem=1MB", "-c", "maintenance_work_mem=16MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 96m
    cpus: 0.10
    pids_limit: 32
    logging: *bounded-logs
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    # Preserve rate-limit counters under pressure; return errors rather than evict.
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 24mb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
  backend:
    image: gk-go/backend:local
    build: ./backend/Shortner
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 640m
    cpus: 0.35
    pids_limit: 128
    logging: *bounded-logs
    environment:
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx192m -Xss512k -XX:MaxDirectMemorySize=32m -XX:ReservedCodeCacheSize=48m -XX:ActiveProcessorCount=1"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      SERVER_TOMCAT_THREADS_MAX: "20"
      SERVER_TOMCAT_THREADS_MIN_SPARE: "2"
      SERVER_TOMCAT_MAX_CONNECTIONS: "100"
      SERVER_TOMCAT_ACCEPT_COUNT: "25"
      DB_URL: jdbc:postgresql://db:5432/shortener
      DB_USERNAME: shortener
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      OIDC_ISSUER_URI: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}/auth/realms/shortener
      OIDC_JWK_SET_URI: http://keycloak:8080/auth/realms/shortener/protocol/openid-connect/certs
      OIDC_AUDIENCE: shortener-api
      APP_BASE_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend:
    image: gk-go/frontend:local
    build: ./frontend
    restart: unless-stopped
    mem_limit: 32m
    memswap_limit: 64m
    cpus: 0.10
    pids_limit: 32
    logging: *bounded-logs
    environment:
      NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE: "1"
      API_BASE_URL: /api/v1
      OIDC_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}/auth
      OIDC_REALM: shortener
      OIDC_CLIENT_ID: gk-go-web
      REGISTRATION_ENABLED: "true"
    depends_on: [backend]
volumes:
  auth-data:
  postgres-data:
  redis-data:
