services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
    ports: ["127.0.0.1:8180:8080"]
    volumes:
      - ./infra/keycloak/shortener-realm.json:/opt/keycloak/data/import/shortener-realm.json:ro
      - keycloak-data:/opt/keycloak/data
  oracle:
    image: gvenzl/oracle-free:23-slim
    profiles: ["full"]
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
      APP_USER: shortener
      APP_USER_PASSWORD: ${DB_PASSWORD:-}
    volumes: ["oracle-data:/opt/oracle/oradata"]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4.12-alpine
    profiles: ["full"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend/Shortner
    profiles: ["full"]
    environment:
      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      DB_USERNAME: shortener
      DB_PASSWORD: ${DB_PASSWORD:-}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      OIDC_ISSUER_URI: http://localhost:8180/realms/shortener
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/shortener/protocol/openid-connect/certs
      OIDC_AUDIENCE: shortener-api
      APP_BASE_URL: http://localhost:${APP_PORT:-8090}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports: ["127.0.0.1:${APP_PORT:-8090}:8080"]
    depends_on:
      oracle: {condition: service_healthy}
      redis: {condition: service_healthy}
      keycloak: {condition: service_started}
  frontend:
    build: ./frontend
    profiles: ["full"]
    ports: ["127.0.0.1:5173:8080"]
    environment:
      API_BASE_URL: /api/v1
      OIDC_URL: http://localhost:8180
      OIDC_REALM: shortener
      OIDC_CLIENT_ID: shortener-dev
    depends_on:
      backend: {condition: service_started}
volumes:
  keycloak-data:
  oracle-data:
  redis-data:
