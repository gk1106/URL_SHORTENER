spring:
  application:
    name: url-shortener
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration/oracle
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl.enabled: ${REDIS_SSL_ENABLED:false}
      connect-timeout: 500ms
      timeout: 500ms
      repositories.enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
          jwk-set-uri: ${OIDC_JWK_SET_URI}
          audiences: ${OIDC_AUDIENCE:shortener-api}
  mvc:
    problemdetails.enabled: true
server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none
  tomcat:
    max-http-form-post-size: 16KB
    max-swallow-size: 16KB
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web.exposure.include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes.enabled: true
app:
  base-url: ${APP_BASE_URL}
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS}
  cache.enabled: ${CACHE_ENABLED:true}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    api-per-minute: 60
    redirect-per-minute: 300
logging:
  config: classpath:log4j2-spring.xml
