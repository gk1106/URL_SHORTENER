name: Backend
on:
  push:
    paths: ['backend/Shortner/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/Shortner/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/Shortner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify on Java 17
        run: bash mvnw -B verify
