name: Backend
on:
  push:
    paths: ['backend/Shortner/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/Shortner/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/Shortner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify on Java 17
        run: bash mvnw -B verify
  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shortener_test
          POSTGRES_USER: shortener_test
          POSTGRES_PASSWORD: disposable-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortener_test -d shortener_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend/Shortner
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/shortener_test
      SPRING_DATASOURCE_USERNAME: shortener_test
      SPRING_DATASOURCE_PASSWORD: disposable-ci-test-only
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration/postgresql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify PostgreSQL migrations and application behavior
        run: bash mvnw -B verify
