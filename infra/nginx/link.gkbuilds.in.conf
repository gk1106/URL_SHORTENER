# Install as a NEW /etc/nginx/conf.d/link.gkbuilds.in.conf file.
# Obtain HTTPS with Certbot before starting the application.
# Certbot's --nginx --redirect command adds the certificate and HTTPS listener.
server {
    listen 80;
    server_name link.gkbuilds.in;

    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 16k;
    }
}
